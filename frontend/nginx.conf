server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Resolve "backend" per request (cached 10 s) instead of once at startup:
    # otherwise every backend restart gets a new IP and the UI answers 502 until nginx restarts too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { return 200 "ok\n"; }

    # Backend API; "backend" is the compose service name.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
