global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]
  # Turjo's forecaster exposes /metrics too; the target is simply down until it is deployed.
  - job_name: forecaster
    static_configs:
      - targets: ["forecaster:8090"]
