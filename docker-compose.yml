services:
  # The official organizer image. We never modify it.
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}  # paused | running
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-dev}
    environment:
      SIMULATOR_URL: http://simulator-api:8000
      OPERATOR_KEY: ${OPERATOR_KEY:?set OPERATOR_KEY in .env (see .env.example)}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      simulator-api:
        condition: service_healthy
    restart: on-failure
